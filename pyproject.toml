[project]
name = "horizon-notes-mcp"
version = "0.1.0"
description = "A small SQLite notes MCP designed for deployment on Prefect Horizon"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_auth"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[project.scripts]
horizon-notes = "mcp_auth.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
