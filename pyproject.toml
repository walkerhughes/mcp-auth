[project]
name = "horizon-notes-mcp"
version = "0.1.0"
description = "A Supabase-backed notes MCP designed for deployment on Prefect Horizon"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.7",
    "psycopg[binary]>=3.2,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_auth"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.12",
]

[project.scripts]
horizon-notes = "mcp_auth.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["database_url", "mcp_auth"]
